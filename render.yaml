services:
  - type: web
    runtime: static
    name: baseball-road
    buildCommand: npm ci --ignore-scripts && npm run build && npm test
    staticPublishPath: ./public
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /release.json
        name: Cache-Control
        value: no-cache
      - path: /play/sw.js
        name: Cache-Control
        value: no-cache
      - path: /play/index.html
        name: Cache-Control
        value: no-cache
