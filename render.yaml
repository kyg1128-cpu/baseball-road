services:
  - type: web
    runtime: static
    name: baseball-road-kyg1128
    buildCommand: npm ci --ignore-scripts && npm run build && npm test
    staticPublishPath: ./public
    headers:
      # Only the public, hash-verified update binary accepts file:// origins.
      # No authenticated or game-save endpoint is exposed cross-origin.
      - path: /runtime/*
        name: Access-Control-Allow-Origin
        value: "null"
      - path: /runtime/*
        name: Cache-Control
        value: no-store
      - path: /runtime/*
        name: Content-Type
        value: application/octet-stream
      - path: /play/*
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /release.json
        name: Cache-Control
        value: no-cache
      - path: /play/sw.js
        name: Cache-Control
        value: no-cache
      - path: /play/index.html
        name: Cache-Control
        value: no-cache
